name: business_tracker
description: >-
  Offline-first business inventory, sales, and finance tracker for Android.
  Track inventory, manage sales, and monitor finances without internet connectivity.
  Features comprehensive reporting, staff management, and role-based access control.

publish_to: "none"
version: 1.0.0+1

homepage: https://github.com/henimovable-alt/Financial-apk
repository: https://github.com/henimovable-alt/Financial-apk
issue_tracker: https://github.com/henimovable-alt/Financial-apk/issues

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter

  # State Management
  riverpod: ^2.4.0
  riverpod_annotation: ^2.3.0

  # SQLite Database
  sqflite: ^2.3.2
  sqflite_common_ffi: ^2.3.0

  # File & Path Management
  path: ^1.9.0
  path_provider: ^2.1.0

  # Date & Localization
  intl: ^0.19.0

  # Security
  flutter_secure_storage: ^9.0.0
  bcrypt: ^1.1.1

  # Utilities
  uuid: ^4.0.0
  equatable: ^2.0.5

  # JSON Serialization
  json_annotation: ^4.8.1

  # Data Export & Reporting
  pdf: ^3.10.0
  csv: ^5.0.1
  share_plus: ^7.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  build_runner: ^2.4.0
  json_serializable: ^6.7.1
  riverpod_generator: ^2.3.0

  # Testing
  mockito: ^5.4.0

flutter:
  uses-material-design: true
