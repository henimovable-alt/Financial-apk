name: business_tracker
description: >-
  Offline-first business inventory, sales, and finance tracker for Android.
  Track inventory, manage sales, and monitor finances without internet connectivity.
publish_to: "none"
version: 1.0.0+1

homepage: https://github.com/henimovable-alt/Financial-apk
repository: https://github.com/henimovable-alt/Financial-apk
issue_tracker: https://github.com/henimovable-alt/Financial-apk/issues

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.4.1
  sqflite: ^2.3.2
  path: ^1.9.0
  intl: ^0.19.0
  shared_preferences: ^2.2.2
  crypto: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
